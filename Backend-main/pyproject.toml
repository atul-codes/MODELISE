[project]
name = "modelise-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "bcrypt==4.0.1",
    "cryptography>=44.0.0",
    "fastapi>=0.139.2",
    "grpcio>=1.62.0",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
# Only needed if DATABASE_URL points at a real SQL Server. Local testing
# with a SQLite DATABASE_URL doesn't need this at all - kept optional so
# a plain `pip install .` can't fail on a missing ODBC driver.
mssql = ["pyodbc>=5.3.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
